<path d="M600 533.4 L600 565.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 662.4 L600 694.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="149.4" width="1136" height="89" rx="12" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/>
<rect x="32" y="157.4" width="4" height="73" rx="2" fill="#64748B"/>
<rect x="32" y="441.4" width="1136" height="88" rx="12" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.4"/>
<rect x="32" y="449.4" width="4" height="72" rx="2" fill="#4F46E5"/>
<rect x="32" y="569.4" width="1136" height="89" rx="12" fill="#E6F6F4" stroke="#0F8B80" stroke-width="1.4"/>
