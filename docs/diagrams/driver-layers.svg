<rect x="32" y="698.4" width="1136" height="89" rx="12" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/>
<rect x="32" y="706.4" width="4" height="73" rx="2" fill="#64748B"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#17202C">Your application</text>
<text x="56" y="215" font-size="17" fill="#2B3442">host controller, test rig, Flux middleware ...</text>
<rect x="48" y="323.4" width="104.3" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="56" y="341.5" font-size="16" font-weight="700" fill="#3730A3">sendNmt()</text>
<rect x="160.3" y="323.4" width="225.8" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="168.3" y="341.5" font-size="16" font-weight="700" fill="#3730A3">sdoDownloadExpedited()</text>
<rect x="394" y="323.4" width="187.2" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="402" y="341.5" font-size="16" font-weight="700" fill="#3730A3">NmtCommand::Start</text>
<rect x="589.3" y="323.4" width="185.4" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="597.3" y="341.5" font-size="16" font-weight="700" fill="#3730A3">NmtCommand::Stop</text>
<rect x="782.6" y="323.4" width="271.8" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="790.6" y="341.5" font-size="16" font-weight="700" fill="#3730A3">NmtCommand::PreOperational</text>
<rect x="48" y="357.4" width="238.1" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="56" y="375.5" font-size="16" font-weight="700" fill="#3730A3">NmtCommand::ResetNode</text>
<rect x="294.1" y="357.4" width="325.2" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="302.1" y="375.5" font-size="16" font-weight="700" fill="#3730A3">NmtCommand::ResetCommunication</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#3730A3">VORTEXHOSTSESSION</text>
<text x="265.6" y="307.4" font-size="16" fill="#3730A3">NMT and expedited SDO download, CiA 301 / 402 constants</text>
<text x="56" y="476.4" font-size="20" font-weight="700" fill="#3730A3">VortexCanTransport</text>
<text x="56" y="505.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">send(const VortexCanFrame&amp;)</text>
<text x="56" y="604.4" font-size="20" font-weight="700" fill="#115E59">Your transport</text>
<text x="56" y="635" font-size="17" fill="#2B3442">BaseCan (ESP32 TWAI, STM32 FDCAN), SocketCAN, loopback</text>
<text x="56" y="733.4" font-size="20" font-weight="700" fill="#17202C">CAN bus and Vortex device</text>
<text x="56" y="764" font-size="17" fill="#2B3442">classic CAN, 11-bit COB-IDs: NMT 0x000, SDO request 0x600 + node; the device is the CANopen server</text>
<rect x="32" y="799.8" width="14" height="14" rx="4" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.4"/>
<text x="54" y="814.4" font-size="16" fill="#566070">this library</text>
<rect x="161.8" y="799.8" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0F8B80" stroke-width="1.4"/>
<text x="183.8" y="814.4" font-size="16" fill="#566070">you write</text>
<rect x="282.1" y="799.8" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="304.1" y="814.4" font-size="16" fill="#566070">bus and device</text>
</svg>
