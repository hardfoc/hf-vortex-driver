<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="driver-layers-title driver-layers-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-layers-title">Three layers, one of them yours</title>
<desc id="driver-layers-desc">Layer diagram: the application calls VortexHostSession, which encodes NMT and expedited SDO frames and passes them to the VortexCanTransport interface, which your transport implements with BaseCan, SocketCAN or a loopback, which sends them on the CAN bus to the Vortex device.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="849" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#C7CBFF">ARCHITECTURE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">Three layers, one of them yours</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">The session and the frame encoding are the same everywhere. The transport is one method you write.</text>
<rect x="32" y="131.4" width="1136" height="1" fill="#252F3C"/>
<rect x="32" y="278.4" width="1136" height="123" rx="16" fill="#1C1F3D" stroke="#3B4080" stroke-width="1.2"/>
<path d="M600 242.4 L600 274.4" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 405.4 L600 437.4" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 533.4 L600 565.4" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 662.4 L600 694.4" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="149.4" width="1136" height="89" rx="12" fill="#151C26" stroke="#3A4657" stroke-width="1"/>
<rect x="32" y="157.4" width="4" height="73" rx="2" fill="#94A3B8"/>
<rect x="32" y="441.4" width="1136" height="88" rx="12" fill="#1C1F3D" stroke="#8C93FF" stroke-width="1.4"/>
<rect x="32" y="449.4" width="4" height="72" rx="2" fill="#8C93FF"/>
<rect x="32" y="569.4" width="1136" height="89" rx="12" fill="#0F2A28" stroke="#2DD4BF" stroke-width="1.4"/>
<rect x="32" y="577.4" width="4" height="73" rx="2" fill="#2DD4BF"/>
<rect x="32" y="698.4" width="1136" height="89" rx="12" fill="#151C26" stroke="#3A4657" stroke-width="1"/>
<rect x="32" y="706.4" width="4" height="73" rx="2" fill="#94A3B8"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#E8EDF3">Your application</text>
<text x="56" y="215" font-size="17" fill="#D2DAE4">host controller, test rig, Flux middleware ...</text>
<rect x="48" y="323.4" width="104.3" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="56" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">sendNmt()</text>
<rect x="160.3" y="323.4" width="225.8" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="168.3" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">sdoDownloadExpedited()</text>
<rect x="394" y="323.4" width="187.2" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="402" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">NmtCommand::Start</text>
<rect x="589.3" y="323.4" width="185.4" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="597.3" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">NmtCommand::Stop</text>
<rect x="782.6" y="323.4" width="271.8" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="790.6" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">NmtCommand::PreOperational</text>
<rect x="48" y="357.4" width="238.1" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="56" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">NmtCommand::ResetNode</text>
<rect x="294.1" y="357.4" width="325.2" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="302.1" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">NmtCommand::ResetCommunication</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#C7CBFF">VORTEXHOSTSESSION</text>
<text x="265.6" y="307.4" font-size="16" fill="#C7CBFF">NMT and expedited SDO download, CiA 301 / 402 constants</text>
<text x="56" y="476.4" font-size="20" font-weight="700" fill="#C7CBFF">VortexCanTransport</text>
<text x="56" y="505.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">send(const VortexCanFrame&amp;)</text>
<text x="56" y="604.4" font-size="20" font-weight="700" fill="#A7F3E6">Your transport</text>
<text x="56" y="635" font-size="17" fill="#D2DAE4">BaseCan (ESP32 TWAI, STM32 FDCAN), SocketCAN, loopback</text>
<text x="56" y="733.4" font-size="20" font-weight="700" fill="#E8EDF3">CAN bus and Vortex device</text>
<text x="56" y="764" font-size="17" fill="#D2DAE4">classic CAN, 11-bit COB-IDs: NMT 0x000, SDO request 0x600 + node; the device is the CANopen server</text>
<rect x="32" y="799.8" width="14" height="14" rx="4" fill="#1C1F3D" stroke="#8C93FF" stroke-width="1.4"/>
<text x="54" y="814.4" font-size="16" fill="#9AA6B5">this library</text>
<rect x="161.8" y="799.8" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2DD4BF" stroke-width="1.4"/>
<text x="183.8" y="814.4" font-size="16" fill="#9AA6B5">you write</text>
<rect x="282.1" y="799.8" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="304.1" y="814.4" font-size="16" fill="#9AA6B5">bus and device</text>
</svg>
