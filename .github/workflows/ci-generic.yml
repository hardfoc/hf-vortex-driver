name: Host generic test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build
        run: |
          cmake -B build-generic -S examples/generic
          cmake --build build-generic
      - name: Run
        run: ./build-generic/vortex_driver_generic_check
