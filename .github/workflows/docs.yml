name: Doxygen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  doxygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Build Doxygen
        run: doxygen Doxyfile
      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: vortex-driver-doxygen
          path: docs/html
          retention-days: 14
